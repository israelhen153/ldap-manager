name: CI
on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  # ── Stage 1: Unit tests, lint, security ────────────────────────────
  ci:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          dnf install -y epel-release
          dnf install -y python3.11 python3.11-pip python3.11-devel \
            openldap-devel cyrus-sasl-devel gcc make
      - name: Install package
        run: |
          pip3 install --upgrade pip setuptools wheel
          pip3 install -e ".[dev]"
      - name: Lint
        run: |
          make lint-fix
          make lint
      - name: Type check
        run: make typecheck
      - name: Security scan
        run: make security
      - name: Tests
        run: pytest
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  # ── Stage 2: Integration tests against real OpenLDAP ───────────────
  integration:
    runs-on: ubuntu-latest
    needs: ci

    services:
      openldap:
        image: osixia/openldap:latest
        ports:
          - 389:389
          - 636:636
        env:
          LDAP_ORGANISATION: "TestCorp"
          LDAP_DOMAIN: "test.local"
          LDAP_ADMIN_PASSWORD: "admin"
          LDAP_TLS_VERIFY_CLIENT: "never"
        options: >-
          --health-cmd "ldapsearch -x -H ldap://localhost -b dc=test,dc=local -D cn=admin,dc=test,dc=local -w admin -s base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      LDAP_URI: "ldap://localhost:389"
      LDAP_BIND_DN: "cn=admin,dc=test,dc=local"
      LDAP_BIND_PASSWORD: "admin"
      LDAP_BASE_DN: "dc=test,dc=local"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev ldap-utils jq

      - name: Install ldap-manager
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Wait for OpenLDAP
        run: |
          for i in $(seq 1 30); do
            if ldapsearch -x -H ldap://localhost:389 -b "dc=test,dc=local" \
               -D "cn=admin,dc=test,dc=local" -w admin "(objectClass=*)" dn \
               > /dev/null 2>&1; then
              echo "OpenLDAP ready (${i}s)"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "::error::OpenLDAP did not start in 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Create base OUs
        run: |
          ldapadd -x -H ldap://localhost:389 \
            -D "cn=admin,dc=test,dc=local" -w admin <<'EOF'
          dn: ou=People,dc=test,dc=local
          objectClass: organizationalUnit
          ou: People

          dn: ou=Groups,dc=test,dc=local
          objectClass: organizationalUnit
          ou: Groups
          EOF

      - name: Run integration tests
        run: |
          chmod +x test_integration.sh
          ./test_integration.sh 2>&1 | tee integration_output.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            test_results_*.log
            integration_output.log
          retention-days: 14

  # ── Stage 3: Build RPM (tags only) ────────────────────────────────
  build-rpm:
    runs-on: ubuntu-latest
    needs: [ci, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: rockylinux:8
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          dnf install -y epel-release
          dnf install -y python3.11 python3.11-pip python3.11-devel \
            openldap-devel cyrus-sasl-devel gcc rpm-build
      - name: Build sdist
        run: |
          pip3 install --upgrade pip setuptools wheel build
          python3 -m build --sdist
      - name: Build RPM
        run: |
          VERSION=$(python3 -c "
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/*.tar.gz ~/rpmbuild/SOURCES/
          cat > ~/rpmbuild/SPECS/ldap-manager.spec <<- SPEC
          Name:           ldap-manager
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        LDAP administration for OpenLDAP
          License:        MIT
          URL:            https://github.com/israelhen153/ldap-manager
          Source0:        ldap_manager-%{version}.tar.gz
          BuildArch:      noarch
          BuildRequires:  python3.11-devel python3.11-setuptools python3.11-pip
          Requires:       python3-ldap python3-pyyaml python3-click python3-passlib
          Requires:       openldap-clients openldap-servers

          %description
          LDAP administration for OpenLDAP. Dry-run everything before production
          blows up. Fits into CI pipelines and cron jobs that web UIs cannot reach.

          %prep
          %setup -n ldap_manager-%{version}

          %build

          %install
          python3.11 -m pip install . --root=%{buildroot} --no-deps --ignore-installed --prefix=/usr

          %files
          %license LICENSE
          /usr/lib/python3.11/site-packages/ldap_manager/
          /usr/lib/python3.11/site-packages/ldap_manager-*.dist-info/
          %{_bindir}/ldap-manager
          %{_bindir}/lmgr
          SPEC
          rpmbuild -ba ~/rpmbuild/SPECS/ldap-manager.spec
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ~/rpmbuild/RPMS/noarch/*.rpm
          retention-days: 30

  # ── Stage 4: Publish to PyPI (tags only) ──────────────────────────
  publish-pypi:
    runs-on: ubuntu-latest
    needs: [ci, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: pip install --upgrade pip build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── Stage 5: GitHub Release (tags only) ───────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [ci, integration, build-rpm, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: rpms/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpms/*.rpm
          generate_release_notes: true
